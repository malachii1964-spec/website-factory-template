name: Quality gates

# The validator outside the agent. The Stop hook can be bypassed by running
# Claude with hooks disabled; this cannot.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  malachii:
    name: malachii — typecheck and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # node:sqlite and native TypeScript stripping both need 22.18+.
          node-version: "22.18"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node_modules/.bin/tsc --noEmit -p malachii/tsconfig.json
      - run: node_modules/.bin/vitest run --root malachii

  site:
    name: site — typecheck, lint, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node_modules/.bin/tsc --noEmit
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
