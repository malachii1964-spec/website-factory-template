<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    The record, reduced to a favicon: the heavy rule under a table head, then
    ruled rows, with one row struck in iron red — the site's single accent,
    which means "cutting now" here exactly as it does on the page.

    It is the site's own signature element rather than the farm's emblem. The
    ring-and-roots mark in the owner's brand artwork is their asset and is not
    approximated; when the real file lands in public/brand it can replace this.

    Paper background is drawn explicitly so the mark does not vanish against a
    dark browser chrome.
  -->
  <rect width="32" height="32" fill="#F4F1EA"/>
  <rect x="5" y="8" width="22" height="2.2" fill="#1B1916"/>
  <rect x="5" y="14" width="22" height="1.2" fill="#1B1916" opacity="0.55"/>
  <rect x="5" y="19" width="14" height="1.6" fill="#9E3B1D"/>
  <rect x="5" y="24" width="22" height="1.2" fill="#1B1916" opacity="0.55"/>
</svg>
