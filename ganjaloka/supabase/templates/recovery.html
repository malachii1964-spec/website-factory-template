<!doctype html>
<html lang="en">
  <body style="margin:0;padding:32px 16px;background:#110e14;color:#ece7df;font-family:Arial,Helvetica,sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;margin:0 auto;">
      <tr><td style="font-size:22px;font-weight:800;letter-spacing:0.08em;color:#f2a93b;">GANJALOKA</td></tr>
      <tr><td style="padding-top:24px;font-size:16px;line-height:1.6;">
        Someone asked to reset the password for this account. Use the button below to choose a new one. The link works once and expires in an hour.
      </td></tr>
      <tr><td style="padding-top:24px;">
        <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/reset-password"
           style="display:inline-block;padding:12px 20px;background:#f2a93b;color:#110e14;font-weight:700;text-decoration:none;border-radius:8px;">
          Choose a new password
        </a>
      </td></tr>
      <tr><td style="padding-top:24px;font-size:13px;line-height:1.6;color:#9a929f;">
        If you didn't ask for this, ignore this email. Your password stays the same.
      </td></tr>
    </table>
  </body>
</html>
